<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#14161a"/>
  <!-- the previewer's bar -->
  <rect width="1200" height="46" fill="#1b1e24"/>
  <text x="28" y="30" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#f2f2f2">AO3 previewer</text>
  <rect x="1010" y="10" width="78" height="26" rx="5" fill="#2a2e36"/>
  <text x="1049" y="28" text-anchor="middle" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="13" fill="#f2f2f2">Save CSS</text>
  <rect x="1098" y="10" width="78" height="26" rx="5" fill="#2a2e36"/>
  <text x="1137" y="28" text-anchor="middle" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="13" fill="#b9c0c9">Reset CSS</text>
  <!-- the work, AO3-style, on the left -->
  <rect x="0" y="46" width="740" height="584" fill="#ffffff"/>
  <rect x="0" y="46" width="740" height="40" fill="#900"/>
  <text x="28" y="73" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#fff">Archive of Our Own</text>
  <text x="60" y="160" text-anchor="start" font-family="Georgia, serif" font-size="34" fill="#2a2a2a">Lorem Ipsum Dolor Sit Amet</text>
  <text x="60" y="192" font-family="Georgia, serif" font-size="18" fill="#900">Lorem_Ipsum</text>
  <g fill="#e8e8e8"><rect x="60" y="222" width="120" height="20" rx="3"/><rect x="190" y="222" width="150" height="20" rx="3"/><rect x="350" y="222" width="90" height="20" rx="3"/></g>
  <g fill="#d0d0d0">
    <rect x="60" y="280" width="620" height="12" rx="3"/><rect x="60" y="304" width="580" height="12" rx="3"/><rect x="60" y="328" width="600" height="12" rx="3"/><rect x="60" y="352" width="420" height="12" rx="3"/>
    <rect x="60" y="392" width="610" height="12" rx="3"/><rect x="60" y="416" width="560" height="12" rx="3"/><rect x="60" y="440" width="630" height="12" rx="3"/><rect x="60" y="464" width="380" height="12" rx="3"/>
    <rect x="60" y="504" width="590" height="12" rx="3"/><rect x="60" y="528" width="620" height="12" rx="3"/><rect x="60" y="552" width="300" height="12" rx="3"/>
  </g>
  <!-- the CSS drawer on the right -->
  <rect x="740" y="46" width="460" height="584" fill="#1b1e24"/>
  <rect x="740" y="46" width="2" height="584" fill="#2f343d"/>
  <rect x="740" y="46" width="460" height="40" fill="#14161a"/>
  <text x="770" y="72" font-family="Inconsolata, Menlo, monospace" font-size="15" font-weight="700" fill="#f2f2f2">{}  CSS</text>
  <text x="850" y="72" font-family="Inconsolata, Menlo, monospace" font-size="15" fill="#7d8590">Work Content</text>
  <g font-family="Inconsolata, Menlo, monospace" font-size="19" xml:space="preserve">
    <text x="770" y="130"><tspan fill="#e6a86b">#workskin</tspan><tspan fill="#c9d1d9"> p {</tspan></text>
    <text x="800" y="162"><tspan fill="#79c0ff">font-family</tspan><tspan fill="#c9d1d9">: Georgia, serif;</tspan></text>
    <text x="800" y="194"><tspan fill="#79c0ff">line-height</tspan><tspan fill="#c9d1d9">: 1.8;</tspan></text>
    <text x="770" y="226"><tspan fill="#c9d1d9">}</tspan><tspan fill="#c9d1d9"></tspan></text>
    <text x="770" y="290"><tspan fill="#e6a86b">#workskin</tspan><tspan fill="#c9d1d9"> .letter {</tspan></text>
    <text x="800" y="322"><tspan fill="#79c0ff">border</tspan><tspan fill="#c9d1d9">: 1px solid #ccc;</tspan></text>
    <text x="800" y="354"><tspan fill="#79c0ff">padding</tspan><tspan fill="#c9d1d9">: 1em 2em;</tspan></text>
    <text x="800" y="386"><tspan fill="#79c0ff">background</tspan><tspan fill="#c9d1d9">: #f9f6f0;</tspan></text>
    <text x="770" y="418"><tspan fill="#c9d1d9">}</tspan><tspan fill="#c9d1d9"></tspan></text>
  </g>
  <!-- the pitch -->
  <rect x="740" y="470" width="460" height="160" fill="#14161a"/>
  <text x="770" y="530" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f2f2f2">AO3 skin previewer</text>
  <text x="770" y="568" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="20" fill="#b9c0c9">See your work or site skin on a real</text>
  <text x="770" y="596" font-family="Space Grotesk, Helvetica, Arial, sans-serif" font-size="20" fill="#b9c0c9">AO3 page as you type. No account needed.</text>
</svg>
